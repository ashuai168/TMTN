<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>下单耗时 · TMTN</title>
<link rel="icon" type="image/svg+xml" href="logo.svg?v=2" />
<style>
/* 下单耗时页：每笔买卖从点击到上链花了多久，卡在哪一步。数据来自 /api/latency/orders（本钱包 + 其他钱包后端） */
:root {
  color-scheme: dark;
  --bg: #07090c; --panel: #0e1217; --panel2: #131820; --line: #1c232c; --line2: #252d38;
  --text: #e9edf2; --muted: #8b95a2; --dim: #5d6672; --g: #1ecb81; --r: #f6465d; --y: #f0b90b;
  --s-net: #3987e5; --s-pre: #d95926; --s-approve: #199e70; --s-quote: #c98500; --s-call: #d55181; --s-confirm: #008300; --s-wait: #9085e9; --s-other: #5a616b;
  --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .r { color: var(--r); } .g { color: var(--g); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 60px; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.head h1 { font-size: 20px; margin: 0; }
.head a.back { text-decoration: none; color: var(--muted); font-size: 12px; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 5; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--panel2); color: var(--text); }
select { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 8px; }
label.ck { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.btn { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.warn { border: 1px solid #5a4410; background: rgba(240,185,11,.08); color: #f3d27a; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font: 600 24px/1.2 var(--mono); margin-top: 2px; }
.tile .v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 14px; margin: 0 0 2px; }
.card .ch { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.card .ch .note { color: var(--muted); font-size: 12px; flex-basis: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.grow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 210px; gap: 10px; align-items: center; padding: 5px 0; }
.grow .lab { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .lab b { font-weight: 600; }
.grow .num { font: 12px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.grow .num b { color: var(--text); font-weight: 600; }
.bar { position: relative; height: 18px; display: flex; gap: 2px; }
.bar span { height: 100%; min-width: 0; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.bar span:only-child { border-radius: 4px; }
.bar span:hover { filter: brightness(1.25); }
.mini { height: 10px; gap: 1px; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 160px; position: relative; border-bottom: 1px solid var(--line2); }
.hist .hb { flex: 1; background: var(--s-net); border-radius: 4px 4px 0 0; min-height: 0; position: relative; }
.hist .hb:hover { filter: brightness(1.25); }
.hist .hit { position: absolute; inset: auto 0 0 0; height: 160px; }
.hist .mark { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--muted); pointer-events: none; }
.hist .mark span { position: absolute; top: -2px; left: 4px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; background: var(--panel); padding: 0 2px; }
.haxis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--dim); margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--panel2); }
td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.tag.buy { color: var(--g); border-color: rgba(30,203,129,.4); } .tag.sell { color: var(--r); border-color: rgba(246,70,93,.4); }
.slow { white-space: nowrap; }
.slow i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.steps td { background: var(--bg); padding: 8px 14px 12px; }
.steps ol { margin: 0; padding-left: 18px; font-size: 12px; }
.steps li { margin: 2px 0; }
.steps li .ms { font-family: var(--mono); color: var(--text); display: inline-block; min-width: 70px; }
.tablewrap { overflow-x: auto; }
#tip { position: fixed; pointer-events: none; background: #1b222c; border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; font-size: 12px; z-index: 50; max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.5); display: none; }
#tip .t { font-weight: 600; margin-bottom: 3px; }
#tip .r2 { display: flex; justify-content: space-between; gap: 14px; } #tip .r2 span:last-child { font-family: var(--mono); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 720px) {
  .grow { grid-template-columns: 1fr; gap: 3px; } .grow .num { text-align: left; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>⏱ 下单耗时</h1><a class="back" href="/">← 回到 TMTN</a><span class="muted" id="updated"></span></div>
  <p class="sub">每笔买入 / 卖出从你点下按钮，到交易在链上确认，一共花了多久，以及时间花在哪一步。只统计已成交的订单（失败单单独计数）。</p>

  <div class="filters">
    <div class="seg" id="fRange"><button data-v="1h" class="on">1 小时</button><button data-v="24h">24 小时</button><button data-v="7d">7 天</button><button data-v="30d">30 天</button></div>
    <div class="seg" id="fSide"><button data-v="all" class="on">买 + 卖</button><button data-v="buy">买入</button><button data-v="sell">卖出</button></div>
    <div class="seg" id="fWallet"><button data-v="all" class="on">全部钱包</button></div>
    <select id="fKind"><option value="all">全部路线</option></select>
    <label class="ck" title="baw 要求在币安 App 里确认（或没等到结果）的订单，耗时里包含你在手机上操作的时间，会把统计拉高"><input type="checkbox" id="fApp" checked /> 排除需 App 确认的订单</label>
    <button class="btn" id="reload">刷新</button>
  </div>
  <div id="warns"></div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="ch"><h2>平均每笔的时间花在哪</h2>
      <div class="seg" id="fGroup"><button data-v="kind" class="on">按路线</button><button data-v="wallet">按钱包</button><button data-v="side">按买卖</button><button data-v="kindside">路线 × 买卖</button></div>
      <div class="note">条的长度是平均总耗时，分段是各阶段的平均耗时；右边是中位数 / p90。鼠标放上去看每段多少毫秒。</div>
    </div>
    <div class="legend" id="legend"></div>
    <div id="groups"></div>
  </div>

  <div class="card">
    <div class="ch"><h2>总耗时分布</h2><div class="note">每根柱子是落在这个耗时区间的成交笔数，虚线是中位数和 p90。</div></div>
    <div id="hist"></div>
  </div>

  <div class="card">
    <div class="ch"><h2>最慢的订单</h2><div class="note">「最慢的一步」是这笔订单里耗时最长的阶段。点一行展开每一步的时间线。</div></div>
    <div class="tablewrap" id="slowest"></div>
  </div>

  <div class="card">
    <div class="ch"><h2>全部订单</h2><label class="ck"><input type="checkbox" id="fFailed" /> 显示失败单</label><div class="note">最新的在上面，最多显示 150 笔。</div></div>
    <div class="tablewrap" id="all"></div>
  </div>
  <p class="sub" id="foot"></p>
</div>
<div id="tip"></div>
<script src="latency.js?v=1"></script>
</body>
</html>
